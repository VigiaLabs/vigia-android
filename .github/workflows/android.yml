name: Android production gates

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate wrapper and compile both flavors
        run: ./gradlew --no-daemon --stacktrace :app:compileDemoDebugKotlin :app:compileProdDebugKotlin
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace test
      - name: Android lint
        run: ./gradlew --no-daemon --stacktrace lint
